services:
  web:
    image: node:22-slim
    working_dir: /app
    # Dev server on the cloned source, dependency install on startup so edits and
    # lockfile changes show up without rebuilding an image.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: "Charlie's Chocolate Factory"
      base44.kind: web
      base44.port: '3000'

volumes:
  node_modules:
