services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Dependencies live in a named volume (not the bind mount) so the host
    # checkout stays clean; they are installed from the lockfile on every start.
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        exec npm run dev
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "Chocolate Factory"
      base44.kind: web
      base44.port: "3000"

volumes:
  node_modules:
